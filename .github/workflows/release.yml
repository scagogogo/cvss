name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run Tests
        run: |
          # Run all tests (cmd has no unit tests; pkg is where coverage is enforced)
          go test -race ./cmd/...
          go test -race -coverprofile=coverage.txt -covermode=atomic ./pkg/...
          total=$(go tool cover -func=coverage.txt | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage (pkg): ${total}%"
          if [ "$total" != "100.0" ]; then
            echo "Coverage $total% is below the 100% threshold — refusing to release" >&2
            exit 1
          fi
          echo "Coverage threshold (100%) met"

  goreleaser:
    name: Release with GoReleaser
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
